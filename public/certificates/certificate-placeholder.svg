<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="1000" fill="#05070a"/>
  
  <!-- Decorative corner elements -->
  <g stroke="#d9a84e" stroke-width="3" fill="none">
    <!-- Top-left corner -->
    <line x1="40" y1="40" x2="120" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="120"/>
    
    <!-- Top-right corner -->
    <line x1="1560" y1="40" x2="1480" y2="40"/>
    <line x1="1560" y1="40" x2="1560" y2="120"/>
    
    <!-- Bottom-left corner -->
    <line x1="40" y1="960" x2="120" y2="960"/>
    <line x1="40" y1="960" x2="40" y2="880"/>
    
    <!-- Bottom-right corner -->
    <line x1="1560" y1="960" x2="1480" y2="960"/>
    <line x1="1560" y1="960" x2="1560" y2="880"/>
  </g>
  
  <!-- Center badge/seal -->
  <g>
    <!-- Outer circle -->
    <circle cx="800" cy="400" r="180" fill="none" stroke="#d9a84e" stroke-width="2" opacity="0.6"/>
    <circle cx="800" cy="400" r="170" fill="none" stroke="#f1c66d" stroke-width="1" opacity="0.3"/>
    
    <!-- Inner circle -->
    <circle cx="800" cy="400" r="140" fill="#d9a84e" opacity="0.08"/>
    
    <!-- Certificate icon (simplified) -->
    <g transform="translate(800, 380)">
      <!-- Document shape -->
      <rect x="-40" y="-50" width="80" height="100" fill="none" stroke="#f1c66d" stroke-width="2" rx="4"/>
      
      <!-- Lines representing text -->
      <line x1="-30" y1="-35" x2="30" y2="-35" stroke="#f1c66d" stroke-width="1.5" opacity="0.7"/>
      <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#f1c66d" stroke-width="1.5" opacity="0.7"/>
      <line x1="-30" y1="-5" x2="30" y2="-5" stroke="#f1c66d" stroke-width="1.5" opacity="0.7"/>
      
      <!-- Seal/ribbon -->
      <circle cx="0" cy="40" r="12" fill="#d9a84e" opacity="0.8"/>
      <path d="M -8 50 Q -15 60 -10 70" stroke="#d9a84e" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M 8 50 Q 15 60 10 70" stroke="#d9a84e" stroke-width="2" fill="none" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="800" y="650" font-family="monospace" font-size="24" text-anchor="middle" fill="#f1c66d" opacity="0.9">
    CERTIFICATE
  </text>
  <text x="800" y="690" font-family="monospace" font-size="14" text-anchor="middle" fill="#d9a84e" opacity="0.6">
    Professional Credential
  </text>
</svg>